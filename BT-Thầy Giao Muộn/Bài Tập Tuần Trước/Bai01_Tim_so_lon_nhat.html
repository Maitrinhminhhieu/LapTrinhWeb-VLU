<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 1: Tìm số lớn nhất</title>
</head>
<body>
    <h2>Bài 1: Tìm số lớn nhất</h2>
    <p><label for="mang">Nhập các số, cách nhau bằng dấu phẩy:</label></p>
    <input type="text" id="mang" value="1, 3, 5, 7, 9" size="35">
    <button type="button" onclick="hienKetQua()">Xem kết quả</button>
    <h3 id="ketqua"></h3>
    <script>
        function findMax(arr) {
            if (arr.length === 0) return null;
            let max = arr[0];
            for (let i = 1; i < arr.length; i++) {
                if (arr[i] > max) max = arr[i];
            }
            return max;
        }

        function hienKetQua() {
            let text = document.getElementById("mang").value.trim();
            let arr = [];
            if (text !== "") {
                let parts = text.split(",");
                for (let i = 0; i < parts.length; i++) {
                    let item = parts[i].trim();
                    if (item === "" || !Number.isFinite(Number(item))) {
                        document.getElementById("ketqua").textContent = "Vui lòng nhập các số hợp lệ.";
                        return;
                    }
                    arr.push(Number(item));
                }
            }
            if (arr.length === 0) {
                document.getElementById("ketqua").textContent = "Vui lòng nhập ít nhất một phần tử.";
                return;
            }
            let result = findMax(arr);
            document.getElementById("ketqua").textContent = "Kết quả: " + JSON.stringify(result);
        }
    </script>
</body>
</html>
