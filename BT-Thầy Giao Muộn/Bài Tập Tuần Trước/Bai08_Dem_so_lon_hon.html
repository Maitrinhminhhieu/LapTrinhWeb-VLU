<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 8: Đếm số lớn hơn</title>
</head>
<body>
    <h2>Bài 8: Đếm số lớn hơn</h2>
    <p><label for="mang">Nhập các số, cách nhau bằng dấu phẩy:</label></p>
    <input type="text" id="mang" value="1, 5, 7, 2, 3" size="35">
    <p><label for="value">Giá trị cần so sánh:</label> <input type="number" id="value" value="3"></p>
    <button type="button" onclick="hienKetQua()">Xem kết quả</button>
    <h3 id="ketqua"></h3>
    <script>
        function countGreaterThan(arr, value) {
            let count = 0;
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] > value) count++;
            }
            return count;
        }

        function hienKetQua() {
            let text = document.getElementById("mang").value.trim();
            let arr = [];
            if (text !== "") {
                let parts = text.split(",");
                for (let i = 0; i < parts.length; i++) {
                    let item = parts[i].trim();
                    if (item === "" || !Number.isFinite(Number(item))) {
                        document.getElementById("ketqua").textContent = "Vui lòng nhập các số hợp lệ.";
                        return;
                    }
                    arr.push(Number(item));
                }
            }
            let valueText = document.getElementById("value").value.trim();
            let value = Number(valueText);
            if (valueText === "" || !Number.isFinite(value)) {
                document.getElementById("ketqua").textContent = "Vui lòng nhập giá trị cần so sánh hợp lệ.";
                return;
            }
            let result = countGreaterThan(arr, value);
            document.getElementById("ketqua").textContent = "Kết quả: " + JSON.stringify(result);
        }
    </script>
</body>
</html>
