<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><title>Đăng ký mua hoa</title></head>
<body>
<h2>ĐĂNG KÝ MUA HOA</h2><p style="color:red">Quý độc giả hãy điền đầy đủ các thông tin theo yêu cầu để nhận được sản phẩm hoa, cây cảnh ưa thích nhất</p><form action="#" method="get"><table><tr><td>Họ và tên:</td><td><input name="hoten" required> (*)</td></tr><tr><td>Địa chỉ:</td><td><input name="diachi" size="35" required> (*)</td></tr><tr><td>Điện thoại:</td><td><input name="dienthoai" type="tel" required> (*)</td></tr><tr><td>Email:</td><td><input name="email" type="email" required> (*)</td></tr><tr><td>Loại hoa:</td><td><select name="loaihoa"><option>Hoa Hồng</option><option>Hoa Cúc</option><option>Hoa Lan</option></select> Màu <select name="mau"><option>Đỏ</option><option>Vàng</option><option>Trắng</option></select></td></tr><tr><td>Số lượng:</td><td><input type="number" name="soluong" min="1" required> (*)</td></tr><tr><td>Đơn vị tính:</td><td><label><input type="radio" name="donvi" value="nhanh"> Nhánh</label> <label><input type="radio" name="donvi" value="bo"> Bó</label> <label><input type="radio" name="donvi" value="chau"> Chậu</label></td></tr><tr><td>Thanh toán:</td><td><label><input type="radio" name="thanhtoan" value="tienmat"> Tiền mặt</label> <label><input type="radio" name="thanhtoan" value="chuyenkhoan"> Chuyển khoản</label> <label><input type="radio" name="thanhtoan" value="mastercard"> Master card</label></td></tr><tr><td>Yêu cầu:</td><td><textarea name="yeucau" rows="5" cols="35"></textarea></td></tr><tr><td></td><td><button type="submit">Đăng ký</button> <button type="reset">Nhập lại</button></td></tr></table></form>
</body>
</html>
