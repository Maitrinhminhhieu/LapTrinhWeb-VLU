<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><title>Đăng ký tài khoản</title></head>
<body>
<h2>ĐĂNG KÝ TÀI KHOẢN</h2><form action="#" method="get"><p><input name="username" placeholder="Nhập username" required></p><p><input name="password" type="password" placeholder="Nhập mật khẩu" required></p><p><input name="email" type="email" placeholder="Nhập địa chỉ email" required></p><p>Ngày sinh <input name="ngaysinh" type="date"> Giới tính <label><input name="gioitinh" type="radio" value="nam"> Nam</label> <label><input name="gioitinh" type="radio" value="nu"> Nữ</label></p><p>Sở thích<br><label><input name="sothich" type="checkbox" value="xemphim"> Xem phim</label><br><label><input name="sothich" type="checkbox" value="nghenhac"> Nghe nhạc</label><br><label><input name="sothich" type="checkbox" value="docsach"> Đọc sách</label><br><label><input name="sothich" type="checkbox" value="dulich"> Du lịch</label></p><p>Giới thiệu bản thân<br><textarea name="gioithieu" rows="5" cols="40"></textarea></p><button type="reset">Cancel</button> <button type="submit">Đăng ký</button></form>
</body>
</html>
