<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển đổi nhiệt độ</title>
</head>
<body>
    <h2>Chuyển đổi nhiệt độ</h2>
    <label for="doC">Nhập nhiệt độ (°C):</label>
    <input type="number" id="doC" step="any">
    <button onclick="chuyendoi()">Chuyển đổi</button>
    <h3 id="ketqua"></h3>
    <script>
        function chuyendoi(){
            const values = ["doC"].map(id => document.getElementById(id).value.trim());
            if (values.some(value => value === "" || !Number.isFinite(Number(value)))) {
                document.getElementById("ketqua").textContent = "Vui lòng nhập đầy đủ dữ liệu hợp lệ, đúng phạm vi yêu cầu.";
                return;
            }
            let doC = Number(document.getElementById("doC").value);
            let doF = (9 / 5) * doC + 32;
            document.getElementById("ketqua").innerHTML = doC + " °C = " + doF + " °F";
        }
    </script>
</body>
</html>
